<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/style.css" />
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-messaging-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey:            "AIzaSyD3z4gPaTzVigmBQQvG_cTVPpQDC_mXJQ4",
      authDomain:        "goldbullsfx-125e0.firebaseapp.com",
      projectId:         "goldbullsfx-125e0",
      storageBucket:     "goldbullsfx-125e0.firebasestorage.app",
      messagingSenderId: "384063050053",
      appId:             "1:384063050053:web:889dc7ae5e72db2aa02e2c"
    });
 
    const messaging = firebase.messaging();
 
    // Request permission and subscribe to 'signals' topic
    async function initNotifications() {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;
 
        const token = await messaging.getToken({
          vapidKey: 'BFcibFgttZe2AmIz9ihmQqwRIP4P_AsGy6dDvyfcyitSWrpUjqDLqNxS6wfcQJxtRMgaf7pYII9P8cxBhvdYkIA' // ← we'll get this next
        });
 
        if (token) {
          // Subscribe token to 'signals' topic via your backend
          await fetch('goldbullsfx-production.up.railway.app/api/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }),
          });
          console.log('Subscribed to signals topic');
        }
      } catch (err) {
        console.error('Notification setup failed:', err);
      }
    }
 
    // Handle foreground notifications
    messaging.onMessage(function(payload) {
      const { title, body } = payload.notification;
      if (Notification.permission === 'granted') {
        new Notification(title, { body, icon: '/icon-192.png' });
      }
    });
  </script>
</head>
<body>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
 
  <!-- Init FCM notifications after page loads -->
  <script>
    window.addEventListener('load', initNotifications);
  </script>

  <script>
  // Handle Android back button — go back instead of closing app
  document.addEventListener('backbutton', function(e) {
    e.preventDefault();
    if (window.history.length > 1) {
      window.history.back();
    }
  }, false);
</script>
